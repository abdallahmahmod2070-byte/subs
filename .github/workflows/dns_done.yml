name: PureDNS Brute Force Scanner (Optimized + WireGuard)

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to brute force (e.g. example.com)'
        required: true
        default: ''
      wordlist_url:
        description: 'URL of the subdomain wordlist (raw text file)'
        required: false
        default: 'https://github.com/nano177/subs/releases/download/sub/part_01.txt'
      resolver_url:
        description: 'URL of the resolver list (raw text file)'
        required: false
        default: 'https://raw.githubusercontent.com/trickest/resolvers/main/resolvers.txt'

jobs:
  bruteforce:
    name: Brute Force (Chunk ${{ matrix.chunk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chunk: 0
            rate: 330
          - chunk: 1
            rate: 335
          - chunk: 2
            rate: 335

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.0'

      # ----------------------------------------------------------------------
      # الكاش المطور: خزن أدوات WireGuard بدلاً من OpenVPN
      # ----------------------------------------------------------------------
      - name: Cache Tools (Go, MassDNS, PureDNS, WireGuard)
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
            /usr/local/bin/massdns
            /usr/local/bin/puredns
            /usr/bin/wg
            /usr/bin/wg-quick
          key: ${{ runner.os }}-puredns-wireguard-v1

      # ----------------------------------------------------------------------
      # تثبيت الأدوات (تم استبدال OpenVPN بـ WireGuard)
      # ----------------------------------------------------------------------
      - name: Install Dependencies & Tools (if cache miss)
        run: |
          NEED_INSTALL=false
          if [ ! -f /usr/local/bin/massdns ] || [ ! -f /usr/local/bin/puredns ] || [ ! -f /usr/bin/wg ]; then
            NEED_INSTALL=true
          fi

          if [ "$NEED_INSTALL" = true ]; then
            echo "🛠️  Installing required packages (MassDNS, PureDNS, WireGuard)..."
            # تم تغيير openvpn إلى wireguard-tools
            sudo apt-get update && sudo apt-get install -y git build-essential libpcap-dev curl wireguard-tools

            # تثبيت MassDNS
            git clone https://github.com/blechschmidt/massdns.git
            cd massdns
            make -j$(nproc)
            sudo cp bin/massdns /usr/local/bin/
            cd .. && rm -rf massdns

            # تثبيت PureDNS
            go install github.com/d3mondev/puredns/v2@latest
            sudo cp $(go env GOPATH)/bin/puredns /usr/local/bin/
          else
            echo "✅ All tools (MassDNS, PureDNS, WireGuard) are already cached."
          fi

      # ----------------------------------------------------------------------
      # تحميل قائمة Resolvers
      # ----------------------------------------------------------------------
      - name: Download Resolver List
        run: |
          curl -s -L "${{ inputs.resolver_url }}" -o resolvers.txt
          echo "Total resolvers: $(wc -l < resolvers.txt)"

      # ----------------------------------------------------------------------
      # تحميل الـ Wordlist
      # ----------------------------------------------------------------------
      - name: Download Wordlist
        run: |
          curl -s -L "${{ inputs.wordlist_url }}" -o subdomains.txt
          echo "Wordlist size: $(wc -l < subdomains.txt) lines"

      # ----------------------------------------------------------------------
      # تقسيم الـ Wordlist إلى 3 أجزاء
      # ----------------------------------------------------------------------
      - name: Split Wordlist into Chunks
        run: |
          split -n l/3 -d -a 1 subdomains.txt chunk_
          for i in 0 1 2; do
            mv "chunk_$i" "chunk_$i.txt"
          done
          echo "Chunk sizes:"
          wc -l chunk_*.txt

      # ----------------------------------------------------------------------
      # ⚡ الاتصال بـ WireGuard بدلاً من OpenVPN
      # ملاحظة: يجب أن يحتوي الـ Secret (VPN_CONFIG) على ملف إعدادات WireGuard
      # بصيغة .conf مشفر بـ base64 (بدلاً من ملف .ovpn)
      # ----------------------------------------------------------------------
      - name: Connect to WireGuard VPN
        run: |
          if [ -n "${{ secrets.VPN_CONFIG }}" ]; then
            echo "🔐 Decoding WireGuard configuration..."
            # فك تشفير الإعدادات (متوقع أن يكون ملف wg0.conf مشفر بـ base64)
            echo "${{ secrets.VPN_CONFIG }}" | base64 -d > wg0.conf

            echo "🔄 Bringing up WireGuard interface..."
            sudo wg-quick up ./wg0.conf 2>&1 | tee /tmp/wg.log

            echo "⏳ Waiting for WireGuard tunnel to establish..."
            VPN_UP=false
            for i in {1..30}; do
              # التحقق من وجود واجهة wg0 ووجود نقل بيانات (handshake) أو عنوان IP
              if ip addr show wg0 >/dev/null 2>&1; then
                # التحقق من أن الـ VPN أعطانا عنوان IP (ليس 0.0.0.0)
                WG_IP=$(ip -4 addr show wg0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n 1)
                if [ -n "$WG_IP" ] && [ "$WG_IP" != "0.0.0.0" ]; then
                  VPN_UP=true
                  break
                fi
              fi
              sleep 2
            done

            if [ "$VPN_UP" = true ]; then
              # التحقق من وصول الإنترنت عبر الـ VPN
              PUBLIC_IP=$(curl -s --max-time 5 --interface wg0 ifconfig.me || curl -s --max-time 5 --interface wg0 icanhazip.com)
              echo "✅ WireGuard tunnel is up. Public IP through VPN: $PUBLIC_IP"
              echo "🔍 Interface details:"
              ip addr show wg0
              sudo wg show wg0
            else
              echo "❌ WireGuard tunnel did not come up within 60s. Traffic will use GitHub's public IP instead."
              echo "--- Last WireGuard log lines ---"
              cat /tmp/wg.log || true
            fi
          else
            echo "⚠️  VPN_CONFIG secret not found. Skipping VPN (requests will use GitHub's public IP)."
          fi

      # ----------------------------------------------------------------------
      # تشغيل PureDNS Brute Force
      # ----------------------------------------------------------------------
      - name: Execute PureDNS Brute Force
        env:
          TARGET: ${{ inputs.target_domain }}
          RATE: ${{ matrix.rate }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          WORDLIST="chunk_${CHUNK}.txt"

          if [ -z "$TARGET" ]; then
            echo "❌ Error: TARGET domain is empty. Please provide a domain."
            exit 1
          fi

          if [ ! -s "$WORDLIST" ]; then
            echo "❌ Error: Wordlist chunk '$WORDLIST' is empty or missing."
            exit 1
          fi

          echo "🔍 Target: $TARGET"
          echo "⚡ Rate limit: $RATE queries/sec"
          echo "📄 Wordlist chunk: $WORDLIST ($(wc -l < $WORDLIST) entries)"
          echo "--- First 5 subdomains from this chunk ---"
          head -n 5 "$WORDLIST"

          cat "$WORDLIST" | puredns bruteforce "$TARGET" \
            -r resolvers.txt \
            --rate-limit "$RATE" \
            --wildcard-threshold 5 \
            --wildcard-tests 10 \
            -w "found_subs_${CHUNK}.txt" \
            --debug

      # ----------------------------------------------------------------------
      # معالجة النتائج
      # ----------------------------------------------------------------------
      - name: Process Results
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          if [ -s "found_subs_${CHUNK}.txt" ]; then
            sort -u "found_subs_${CHUNK}.txt" > "live_subdomains_${CHUNK}.txt"
            echo "✅ Discovered $(wc -l < live_subdomains_${CHUNK}.txt) unique subdomains in chunk ${CHUNK}"
            echo "--- Sample results ---"
            head -n 10 "live_subdomains_${CHUNK}.txt"
          else
            touch "live_subdomains_${CHUNK}.txt"
            echo "ℹ️ No valid subdomains found in chunk ${CHUNK}."
          fi

      # ----------------------------------------------------------------------
      # رفع النتائج
      # ----------------------------------------------------------------------
      - name: Upload Discovered Subdomains (Chunk ${{ matrix.chunk }})
        uses: actions/upload-artifact@v4
        with:
          name: discovered-subs-chunk-${{ matrix.chunk }}
          path: live_subdomains_${{ matrix.chunk }}.txt

  merge-results:
    name: Merge All Results
    needs: bruteforce
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all_results

      - name: Merge and Deduplicate
        run: |
          echo "=== Merging all discovered subdomains ==="
          find ./all_results -name "live_subdomains_*.txt" -exec cat {} \; | sort -u > all_discovered_subdomains.txt
          TOTAL=$(wc -l < all_discovered_subdomains.txt)
          echo "✅ Total unique subdomains found: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "=== Full list ==="
            cat all_discovered_subdomains.txt
          else
            echo "No subdomains were discovered."
          fi

      - name: Upload Merged Results
        uses: actions/upload-artifact@v4
        with:
          name: all-discovered-subdomains-merged
          path: all_discovered_subdomains.txt
